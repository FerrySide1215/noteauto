name: note.com 自動投稿

on:
  # ⚠️ 2026-07-07: note.com がログイン/公開に reCAPTCHA を必須化し、ヘッドレスCIでは
  #    公開不可と判明。運用はローカルの publish-local.ts（実ブラウザ+確認ゲート）へ移行。
  #    毎朝の自動cronは失敗し続けるため無効化。手動実行(workflow_dispatch)のみ残す。
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN（投稿せず動作確認のみ）"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/note-publisher/package.json

      - name: 依存パッケージをインストール
        working-directory: scripts/note-publisher
        run: npm install

      - name: Playwright ブラウザをインストール
        working-directory: scripts/note-publisher
        run: npx playwright install chromium --with-deps

      - name: note.com に投稿
        working-directory: scripts/note-publisher
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ARTICLE: ${{ secrets.NOTION_DB_ARTICLE }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          # note.com は reCAPTCHA でCI自動ログイン不可 → ローカル取得の保存済みセッションを使用
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npm start

      - name: エラー時スクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: /tmp/note-error-*.png
          retention-days: 7
