# 叶結び 石川編 DAY2 — 編集台本（EDL）  仕様書 §12〜§20
# narration_ref は scripts/day2_narration.txt の [id] と対応。
# おみくじ読みシーンは「各社の風景を土台＋おみくじ寄り(allow_repeat)」で連続同写真を避ける。
# final_answer は DAY2素材のみで構成（DAY跨ぎ混入を避ける・§25）。DAY1の振り返りはテロップで行う。

day: 2
capture_date: "2026-08-23"
theme: "方向転換ではなく、軌道修正。"
target_minutes: [10, 14]

title:
  channel: "叶結び"
  chapter: "石川編 DAY2"
  subtitle: "那谷寺で、流れが変わった"

rules:
  no_ai_footage: true
  omikuji_no_rewrite: true

scenes:
  # コールドオープン：那谷寺の奇岩から。DAY1と空気を変える。
  - id: cold_open
    kind: cold_open
    narration_ref: cold_open
    group: natadera
    montage_sequence: [natadera, natadera, natadera]
    bgm: day2_natadera
    mood_shift: true

  - id: title
    kind: title
    group: natadera
    bgm: day2_early
    onscreen:
      - { text: "叶結び", style: title }
      - { text: "石川編 DAY2", style: chapter }
      - { text: "那谷寺で、流れが変わった", style: subtitle }

  # DAY1 recap（15〜25秒のみ・長くしない）
  - id: day1_recap
    kind: recap
    narration_ref: day1_recap
    group: natadera
    bgm: day2_early
    max_seconds: 25
    onscreen_list:
      - "DAY1"
      - "整える"
      - "焦らない"
      - "根を張る"

  # 那谷寺（最大の見せ場・テンポを落とす）
  - id: natadera
    kind: shrine
    narration_ref: natadera
    group: natadera
    bgm: day2_natadera
    location_card: { name: "那谷寺", region: "石川県" }
    slow_tempo: true
    nat_sound_break: true
    omikuji:
      group: natadera_omikuji
      label: "末吉"
      waka_reveal:
        - "もえ出ずる若葉の色ぞ美しき"
        - "花さき実る末も見えつつ"
      highlights:
        - text: "次第次第に運がひらけて盛んになります"
          red: ["次第次第に運がひらけて"]

  - id: natadera_setsumei
    kind: omikuji_read
    narration_ref: natadera_setsumei
    group: natadera
    omikuji:
      group: natadera_omikuji
      highlights:
        - text: "一足とびにとんで事をしようとするとあやまります"
          red: ["一足とび"]

  - id: natadera_beat
    kind: interstitial
    narration_ref: natadera_beat
    group: natadera
    onscreen:
      - { text: "止まって整える", style: onscreen, role: from }
      - { text: "急がず育てる", style: onscreen, role: to }
    transition_arrow: true

  - id: natadera_read
    kind: omikuji_read
    narration_ref: natadera_read
    group: natadera
    omikuji:
      group: natadera_omikuji
      label: "那谷寺　御神籤"
    onscreen:
      - { text: "那谷寺", style: chapter }
      - { text: "今回の旅の転換点", style: subtitle }

  # 菟橋神社（風景1枚のみ→ n_shots=1 の omikuji_read 扱いで連続回避）
  - id: uhashi
    kind: omikuji_read
    narration_ref: uhashi
    group: uhashi
    location_card: { name: "菟橋神社", reading: "うはし", region: "石川県" }
    omikuji:
      group: uhashi_omikuji
      label: "第四十一番　小吉"
      onscreen:
        - { text: "第四十一番", style: onscreen }
        - { text: "小吉", style: onscreen }
      highlights:
        - text: "願望　初めにきをつけねば中途でやぶれる"
          red: ["初めにきをつけねば"]

  - id: uhashi_read
    kind: omikuji_read
    narration_ref: uhashi_read
    group: uhashi
    omikuji:
      group: uhashi_omikuji
      highlights:
        - text: "相手を見極めよ"
          red: ["見極めよ"]

  # 裏面「神の教」（笑う門）— 実物どおり
  - id: uhashi_kami
    kind: omikuji_read
    narration_ref: uhashi_kami
    group: uhashi
    omikuji:
      group: uhashi_omikuji
      label: "神の教（笑う門）"
      highlights:
        - text: "笑う門には幸来る"
          red: ["笑う門には幸"]

  # 安宅住吉神社（DAY2＝石川編全体のクライマックス）
  - id: ataka
    kind: shrine
    narration_ref: ataka
    group: ataka
    bgm: day2_ataka
    location_card: { name: "安宅住吉神社", region: "石川県" }
    prefer_komorebi: true
    omikuji:
      group: ataka_omikuji
      label: "第四十番　吉"
      onscreen:
        - { text: "第四十番", style: onscreen }
        - { text: "吉", style: onscreen }
      highlights:
        - text: "時期を考えてはやくあらため進むがよい"
          red: ["時期を考えて", "あらため"]
        - text: "人と人と互に力あわせてすればよきみちあり"
          red: ["力あわせて"]
        - text: "けれどわるいみちと知りつつ進めばわるし"
          red: ["わるいみちと知りつつ"]

  - id: ataka_beat
    kind: interstitial
    narration_ref: ataka_beat
    group: ataka
    onscreen:
      - { text: "ここで、つながった", style: onscreen }
    hold_after: 0.6

  - id: ataka_koumoku
    kind: omikuji_read
    narration_ref: ataka_koumoku
    group: ataka
    omikuji:
      group: ataka_omikuji
      highlights:
        - text: "早くすれば他人の助けありて調う"
          red: ["他人の助け"]

  # 軌道修正（大きく画面表示）
  - id: kidou_shusei
    kind: answer
    narration_ref: kidou_shusei
    group: ataka
    onscreen:
      - { text: "方向転換ではなく、", style: answer_sub }
      - { text: "軌道修正。", style: answer }
    layout: center_whitespace

  # 神の教（裏面・散りゆく花）
  - id: kami_no_oshie
    kind: omikuji_read
    narration_ref: kami_no_oshie
    group: ataka
    omikuji:
      group: ataka_omikuji
      label: "神の教（散りゆく花）"
      highlights:
        - text: "散りゆく花に流す涙は、稔りの秋の糧となる"
          red: ["稔りの秋の糧"]

  # 最終答え合わせ（DAY2素材で背景・6か所はテロップで振り返り）
  - id: final_answer
    kind: recap_full
    narration_ref: final_answer
    group: montage
    timeline_sequence: [natadera, uhashi, ataka, natadera, uhashi, ataka]
    onscreen_columns:
      - { head: "DAY1", items: ["整理", "警告", "足元固め", "根を張る"] }
      - { head: "DAY2", items: ["再生", "育てる", "見極める", "軌道修正"] }

  # 最終締め
  - id: closing
    kind: answer
    narration_ref: closing
    group: ataka
    bgm: day2_ataka
    onscreen:
      - { text: "叶結び", style: title }
      - { text: "神社で答え合わせ", style: subtitle }

  - id: cta
    kind: outro
    narration_ref: cta
    group: ataka
    cta: "チャンネル登録して、次の神社旅でまたお会いしましょう。"
    no_flashy_animation: true
