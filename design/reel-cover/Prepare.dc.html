<x-dc>

        <div style="font-size: 47px; font-weight: 600; color: #1a1712; line-height: 1.34;">始めたいことを、<br>1つ決めておく</div>

      <div style="display: flex; align-items: baseline; gap: 30px;">
        <div style="font-size: 46px; color: #8a6d2f; flex-shrink: 0;">三</div>
        <div style="font-size: 47px; font-weight: 600; color: #1a1712; line-height: 1.34;">整理して、<br>“まく場所”を空けておく</div>
      </div>
    </div>
  </div>
</div>
